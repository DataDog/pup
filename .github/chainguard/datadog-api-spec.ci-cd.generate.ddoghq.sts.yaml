# Policy for: .github/workflows/ci-cd.yml (pipeline-generate job) in ddoghq/datadog-api-spec
# Allows that workflow to push a branch and open a PR against this repo.
issuer: https://token.actions.githubusercontent.com
subject: repo:ddoghq/datadog-api-spec:pull_request

claim_pattern:
  base_ref: master
  event_name: pull_request
  job_workflow_ref: ddoghq/datadog-api-spec/\.github/workflows/ci-cd\.yml@refs/pull/[0-9]+/merge
  ref: refs/pull/[0-9]+/merge
  repository: ddoghq/datadog-api-spec

permissions:
  contents: write
  pull_requests: write
