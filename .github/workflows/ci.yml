name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Release builds of pup take 3-4x longer than debug ones. The cross-compile
  # jobs only build release on release PRs, to catch release-only breakage
  # before release.yml runs on the tag; every other run builds debug.
  BUILD_FLAGS: ${{ startsWith(github.head_ref, 'release/') && '--release' || '' }}
  BUILD_DIR: ${{ startsWith(github.head_ref, 'release/') && 'release' || 'debug' }}

jobs:
  check-test-coverage:
    name: Check, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ubuntu-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ubuntu-check-
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default stable
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov
      - name: Test with coverage
        run: cargo llvm-cov --lcov --output-path lcov.info --ignore-filename-regex 'main\.rs|auth/' -- --test-threads=1
      - name: Coverage summary
        run: cargo llvm-cov report --ignore-filename-regex 'main\.rs|auth/'
      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: lcov.info

  # Generated client-bump PRs only change platform-independent API client code, which
  # the host build above already compiles. They skip the cross-compile jobs; main still
  # builds every target on push.
  cross-compile-linux:
    name: Cross Compile (Linux)
    if: ${{ !startsWith(github.head_ref, 'datadog-api-spec/generated/') }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ubuntu-cross-linux-musl-${{ env.BUILD_DIR }}-${{ hashFiles('**/Cargo.lock') }}
          # Release PRs fall back to main's debug cache for the registry and git deps.
          restore-keys: cargo-ubuntu-cross-linux-musl-debug-
      - uses: ./.github/actions/install-musl-toolchain
      - name: Build x86_64 musl
        run: cargo build $BUILD_FLAGS --target x86_64-unknown-linux-musl --features vendored-openssl
      - name: Smoke test auth token credential command
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/$BUILD_DIR/pup
          expected_token=pup-ci-placeholder-token
          config_dir="$(mktemp -d)"
          trap 'rm -rf "$config_dir"' EXIT

          test "$(DD_ACCESS_TOKEN="$expected_token" "$bin" auth token)" = "$expected_token"
          "$bin" auth --help >"$config_dir/help"
          grep -q '^  token' "$config_dir/help"
          "$bin" completions zsh >"$config_dir/completions"
          grep -q 'token:Print the current OAuth access token for credential-command integrations' "$config_dir/completions"
          PUP_CONFIG_DIR="$config_dir" DD_TOKEN_STORAGE=file \
            "$bin" agent schema >"$config_dir/full-schema"
          ! grep -q '"full_path": "auth token"' "$config_dir/full-schema"
          PUP_CONFIG_DIR="$config_dir" DD_TOKEN_STORAGE=file \
            "$bin" agent schema --compact >"$config_dir/compact-schema"
          ! grep -q '"full_path": "auth token"' "$config_dir/compact-schema"

          if env -u DD_ACCESS_TOKEN -u DD_API_KEY -u DD_APP_KEY \
            PUP_CONFIG_DIR="$config_dir" DD_TOKEN_STORAGE=file \
            "$bin" auth token >"$config_dir/stdout" 2>"$config_dir/stderr"; then
            echo "ERROR: auth token succeeded without credentials"
            exit 1
          fi
          test ! -s "$config_dir/stdout"
          grep -q 'no token available' "$config_dir/stderr"
      - name: Verify x86_64 static linkage
        run: |
          file target/x86_64-unknown-linux-musl/$BUILD_DIR/pup
          if readelf -d target/x86_64-unknown-linux-musl/$BUILD_DIR/pup | grep -q "(NEEDED)"; then
            echo "ERROR: binary has dynamic NEEDED entries"
            exit 1
          fi
      - name: Build aarch64 musl
        run: cargo build $BUILD_FLAGS --target aarch64-unknown-linux-musl --features vendored-openssl
      - name: Verify aarch64 static linkage
        run: |
          file target/aarch64-unknown-linux-musl/$BUILD_DIR/pup
          if readelf -d target/aarch64-unknown-linux-musl/$BUILD_DIR/pup | grep -q "(NEEDED)"; then
            echo "ERROR: binary has dynamic NEEDED entries"
            exit 1
          fi
      - name: Report sizes
        run: |
          ls -lh target/x86_64-unknown-linux-musl/$BUILD_DIR/pup
          ls -lh target/aarch64-unknown-linux-musl/$BUILD_DIR/pup

  cross-compile-macos:
    name: Cross Compile (macOS)
    if: ${{ !startsWith(github.head_ref, 'datadog-api-spec/generated/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-cross-macos-${{ env.BUILD_DIR }}-${{ hashFiles('**/Cargo.lock') }}
          # Release PRs fall back to main's debug cache for the registry and git deps.
          restore-keys: cargo-cross-macos-debug-
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build all targets
        run: |
          PIDS=()
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            (set -o pipefail
             echo "==> Starting ${target}"
             cargo build $BUILD_FLAGS --target "${target}" 2>&1 \
               | tee "/tmp/${target}.log"
            ) &
            PIDS+=($!)
          done
          status=0
          for pid in "${PIDS[@]}"; do
            wait "$pid" || status=1
          done
          exit $status
      - name: Report sizes
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            echo "${target}:"
            ls -lh "target/${target}/${BUILD_DIR}/pup"
          done

  cross-compile-windows:
    name: Cross Compile (Windows)
    if: ${{ !startsWith(github.head_ref, 'datadog-api-spec/generated/') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-windows-${{ env.BUILD_DIR }}-${{ hashFiles('**/Cargo.lock') }}
          # Release PRs fall back to main's debug cache, which also warms the test build.
          restore-keys: cargo-windows-debug-
      - name: Enable long paths
        run: git config --global core.longpaths true
      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # Debug runs get the binary from `cargo test`, which builds it for the CLI tests.
      - name: Build
        if: env.BUILD_DIR == 'release'
        run: cargo build --release
      - name: Run tests
        run: cargo test --verbose -- --test-threads=1
      - name: Report binary size
        run: ls -lh "target/${BUILD_DIR}/pup.exe"

  npm-packaging:
    name: npm Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test launcher and package builder
        run: node --test 'npm/**/*.test.js'

  wasm:
    name: WASM (WASI + Browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ubuntu-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ubuntu-wasm-
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip2 wasm32-unknown-unknown
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}
      - name: Build WASI
        run: cargo build --target wasm32-wasip2 --no-default-features --features wasi --release
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack
      - name: Build browser WASM
        run: wasm-pack build --target web --no-default-features --features browser
      - name: Report sizes
        run: |
          echo "WASI:"
          ls -lh target/wasm32-wasip2/release/pup.wasm
          echo "Browser WASM:"
          ls -lh pkg/pup_wasm_bg.wasm

  report:
    name: Report status to datadog-api-spec
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'datadog-api-spec/generated/')
    needs:
      - check-test-coverage
      - cross-compile-linux
      - cross-compile-macos
      - cross-compile-windows
      - wasm
    permissions:
      id-token: write
    steps:
      - uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        id: octo-sts
        with:
          scope: ddoghq/datadog-api-spec
          policy: pup.ci.post-status-check
      - name: Post status check
        uses: DataDog/github-actions/post-status-check@65b4875f33ad773d7ba4b005a2cb5f35020295f3 # v2.3.0
        with:
          github-token: ${{ steps.octo-sts.outputs.token }}
          owner: ddoghq
          repo: datadog-api-spec
          # A cancelled run was superseded by a newer push to the generated branch.
          # The cross-compile jobs are skipped on generated branches, so only the
          # host check and WASM jobs must succeed.
          status: ${{ contains(needs.*.result, 'cancelled') && 'pending' || (contains(needs.*.result, 'failure') || needs.check-test-coverage.result != 'success' || needs.wasm.result != 'success') && 'failure' || 'success' }}
          context: main/unit
